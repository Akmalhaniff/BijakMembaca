<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log Masuk — Program Bijak Membaca</title>
  <meta name="theme-color" content="#f6f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bijak Membaca">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var d=localStorage.getItem('sbm_dark_mode');if(d==='true'||(d===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
  <button class="icon-btn" data-dark-toggle aria-label="Tukar mod gelap/terang" style="position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:5"></button>

  <div class="auth">
    <div class="auth-brand">
      <div class="brand-mark" data-icon="book"></div>
      <p class="eyebrow" style="color:var(--primary-ink)">SMK Puncak Alam 3</p>
      <h1>Bijak Membaca</h1>
      <p>Panel Guru · pantau kemajuan bacaan murid</p>
    </div>

    <div class="card" style="padding:22px">
      <div class="seg" role="tablist">
        <button type="button" class="tab on" data-tab="login">Log Masuk</button>
        <button type="button" class="tab" data-tab="register">Daftar</button>
      </div>

      <div class="err-msg" id="errorMsg" role="alert"></div>

      <form id="loginForm" class="stack" style="gap:14px">
        <div class="field">
          <label for="loginEmail">Emel</label>
          <input type="email" id="loginEmail" required autocomplete="email" inputmode="email" autocapitalize="none" placeholder="guru@sekolah.edu.my">
        </div>
        <div class="field">
          <label for="loginPassword">Kata laluan</label>
          <div class="pw-wrap">
            <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
            <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="Tunjuk kata laluan"></button>
          </div>
        </div>
        <button type="submit" class="btn grad block" style="min-height:52px">Log Masuk</button>
      </form>

      <form id="registerForm" class="stack hidden" style="gap:14px">
        <div class="field">
          <label for="regName">Nama penuh</label>
          <input type="text" id="regName" required autocomplete="name" autocapitalize="words" placeholder="cth: Cikgu Aina">
        </div>
        <div class="field">
          <label for="regEmail">Emel</label>
          <input type="email" id="regEmail" required autocomplete="email" inputmode="email" autocapitalize="none" placeholder="guru@sekolah.edu.my">
        </div>
        <div class="field">
          <label for="regPassword">Kata laluan</label>
          <div class="pw-wrap">
            <input type="password" id="regPassword" required autocomplete="new-password" minlength="6" placeholder="Minimum 6 aksara">
            <button type="button" class="pw-toggle" data-target="regPassword" aria-label="Tunjuk kata laluan"></button>
          </div>
        </div>
        <div class="field">
          <label for="regConfirm">Sahkan kata laluan</label>
          <div class="pw-wrap">
            <input type="password" id="regConfirm" required autocomplete="new-password" placeholder="••••••••">
            <button type="button" class="pw-toggle" data-target="regConfirm" aria-label="Tunjuk kata laluan"></button>
          </div>
        </div>
        <button type="submit" class="btn grad block" style="min-height:52px">Daftar Akaun</button>
      </form>

      <div class="divider">atau</div>
      <button type="button" class="btn ghost block" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5.1 3.8-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5l-.1.1-3.6 2.8v.1C3.5 21.3 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.7 0 10.3 0 12s.5 3.3 1.4 4.7l3.8-2.3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.7 1.4 6.8l3.8 2.9c.9-2.9 3.6-5 6.8-5z"/></svg>
        Teruskan dengan Google
      </button>
    </div>

    <p style="text-align:center;margin-top:20px;font-size:14px;font-weight:600">
      <a href="index.html" style="text-decoration:none">← Kembali ke Dashboard</a>
    </p>
  </div>

  <script type="module" src="js/darkmode.js"></script>
  <script type="module">
    import { loginUser, registerUser, loginWithGoogle, onAuthChange } from './js/data.js';
    import './js/ui.js';

    const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const errorMsg = document.getElementById("errorMsg");
    const tabs = document.querySelectorAll(".tab");

    function showMsg(msg, ok = false) {
      errorMsg.textContent = msg;
      errorMsg.classList.toggle("ok", ok);
      errorMsg.classList.add("show");
    }
    function hideError() { errorMsg.classList.remove("show", "ok"); }

    function switchTab(tab) {
      tabs.forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
      loginForm.classList.toggle("hidden", tab !== "login");
      registerForm.classList.toggle("hidden", tab === "login");
      hideError();
    }
    tabs.forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

    function busy(form, on) {
      const b = form.querySelector('button[type="submit"]');
      b.disabled = on;
      if (on) { b.dataset.label = b.textContent; b.textContent = "Sila tunggu…"; }
      else if (b.dataset.label) b.textContent = b.dataset.label;
    }

    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      hideError();
      busy(loginForm, true);
      try {
        await loginUser(document.getElementById("loginEmail").value.trim(), document.getElementById("loginPassword").value);
        window.location.href = "admin.html";
      } catch (err) {
        showMsg(err.message);
        busy(loginForm, false);
      }
    });

    registerForm.addEventListener("submit", async e => {
      e.preventDefault();
      hideError();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const confirm = document.getElementById("regConfirm").value;
      if (password !== confirm) { showMsg("Kata laluan tidak sepadan"); return; }
      busy(registerForm, true);
      registering = true;
      try {
        await registerUser(email, password, name);
        showMsg("Pendaftaran berjaya! Membuka Panel Guru…", true);
        setTimeout(() => window.location.href = "admin.html", 900);
      } catch (err) {
        registering = false;
        showMsg(err.message);
        busy(registerForm, false);
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      hideError();
      try {
        await loginWithGoogle();
        window.location.href = "admin.html";
      } catch (err) {
        showMsg(err.message);
      }
    });

    // Already signed in? Go straight to the panel (but not mid-registration,
    // so the display name finishes saving first).
    let registering = false;
    onAuthChange(user => { if (user && !registering) window.location.href = "admin.html"; });

    document.querySelectorAll(".pw-toggle").forEach(btn => {
      btn.innerHTML = EYE;
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = show ? EYE_OFF : EYE;
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
