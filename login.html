<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk — Program Bijak Membaca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header .emblem {
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }
    .auth-header h1 { font-size: 22px; margin-bottom: 4px; }
    .auth-header p { color: var(--muted); font-size: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg); border-radius: 10px; padding: 4px; }
    .tab { flex: 1; padding: 10px; border: none; background: transparent; font: inherit; font-weight: 600; color: var(--muted); border-radius: 8px; cursor: pointer; transition: .2s; }
    .tab.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .form-group { margin-bottom: 16px; position: relative; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font: inherit; font-size: 15px; color: var(--ink); transition: .2s; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .form-group input::placeholder { color: var(--muted); opacity: 0.7; }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 38px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pwd-toggle:hover { color: var(--ink); }
    .pwd-toggle svg { width: 20px; height: 20px; }
    .btn-block { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .btn-google { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-family: inherit; transition: .2s; }
    .btn-google:hover { background: var(--bg); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .error-msg.show { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="emblem" style="width:60px;height:60px;font-size:22px">BM</div>
        <h1>Program Bijak Membaca</h1>
        <p>Panel Guru — SMK Puncak Alam 3</p>
      </div>
      <button class="btn ghost sm" data-dark-toggle style="position:absolute;top:16px;right:16px" aria-label="Tukar mod gelap/terang"></button>

      <div class="tabs">
        <button class="tab active" data-tab="login">Log Masuk</button>
        <button class="tab" data-tab="register">Daftar</button>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Emel</label>
          <input type="email" id="loginEmail" required autocomplete="email" placeholder="guru@sekolah.edu.my">
        </div>
        <div class="form-group">
          <label for="loginPassword">Kata Laluan</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="pwd-toggle" data-target="loginPassword" aria-label="Tunjuk kata laluan">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button type="submit" class="btn btn-block">Log Masuk</button>
      </form>

      <form id="registerForm" class="hidden">
        <div class="form-group">
          <label for="regName">Nama Penuh</label>
          <input type="text" id="regName" required autocomplete="name" placeholder="Contoh: Cikgu Ahmad">
        </div>
        <div class="form-group">
          <label for="regEmail">Emel</label>
          <input type="email" id="regEmail" required autocomplete="email" placeholder="guru@sekolah.edu.my">
        </div>
        <div class="form-group">
          <label for="regPassword">Kata Laluan</label>
          <input type="password" id="regPassword" required autocomplete="new-password" minlength="4" placeholder="Minimum 4 karakter">
          <button type="button" class="pwd-toggle" data-target="regPassword" aria-label="Tunjuk kata laluan">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="form-group">
          <label for="regConfirm">Sahkan Kata Laluan</label>
          <input type="password" id="regConfirm" required autocomplete="new-password" placeholder="••••••••">
          <button type="button" class="pwd-toggle" data-target="regConfirm" aria-label="Tunjuk kata laluan">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button type="submit" class="btn btn-block">Daftar Akaun</button>
      </form>

      <div class="divider">atau</div>
      <button type="button" class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5.1 3.8-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5l-.1.1-3.6 2.8v.1C3.5 21.3 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.7 0 10.3 0 12s.5 3.3 1.4 4.7l3.8-2.3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.7 1.4 6.8l3.8 2.9c.9-2.9 3.6-5 6.8-5z"/></svg>
        Log masuk dengan Google
      </button>

      <div class="auth-footer">
        <p>Tiada akaun? <a href="#" data-switch="register">Daftar di sini</a></p>
        <p style="margin-top:8px"><a href="index.html">← Kembali ke Dashboard</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { loginUser, registerUser, loginWithGoogle, getCurrentUser } from './js/data.js';
    
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const errorMsg = document.getElementById("errorMsg");
    const tabs = document.querySelectorAll(".tab");

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add("show");
    }
    function hideError() {
      errorMsg.classList.remove("show");
    }

    function switchTab(tab) {
      tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
      if (tab === "login") {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
      } else {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
      }
      hideError();
    }

    tabs.forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
    document.querySelector('[data-switch="register"]').addEventListener("click", e => { e.preventDefault(); switchTab("register"); });

    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      hideError();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      try {
        await loginUser(email, password);
        window.location.href = "admin.html";
      } catch (err) {
        showError(err.message);
      }
    });

    registerForm.addEventListener("submit", async e => {
      e.preventDefault();
      hideError();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const confirm = document.getElementById("regConfirm").value;
      if (password !== confirm) { showError("Kata laluan tidak sepadan"); return; }
      try {
        await registerUser(email, password, name);
        showError("Pendaftaran berjaya! Sila log masuk.");
        errorMsg.style.background = "#f0fdf4";
        errorMsg.style.borderColor = "#bbf7d0";
        errorMsg.style.color = "#166534";
        setTimeout(() => switchTab("login"), 1500);
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      hideError();
      try {
        await loginWithGoogle();
        window.location.href = "admin.html";
      } catch (err) {
        showError(err.message);
      }
    });

    if (getCurrentUser()) {
      window.location.href = "admin.html";
    }

    // Password toggle
    document.querySelectorAll(".pwd-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        btn.querySelector(".eye-open").style.display = isPassword ? "none" : "block";
        btn.querySelector(".eye-closed").style.display = isPassword ? "block" : "none";
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
