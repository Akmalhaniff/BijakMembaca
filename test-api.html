<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
    .btn { padding: 10px 20px; margin: 5px; cursor: pointer; background: #0e7490; color: white; border: none; border-radius: 5px; }
    .btn:hover { background: #155e75; }
    pre { background: #f1f5f9; padding: 15px; border-radius: 8px; overflow: auto; max-height: 400px; }
    .error { background: #fef2f2; color: #b91c1c; }
    .success { background: #f0fdf4; color: #166534; }
  </style>
</head>
<body>
  <h1>Apps Script API Test</h1>
  <p>URL: <code id="apiUrl"></code></p>
  
  <div>
    <button class="btn" onclick="testGetUsers()">Test getUsers</button>
    <button class="btn" onclick="testGetData()">Test getData</button>
    <button class="btn" onclick="testSaveUser()">Test saveUser (new test user)</button>
    <button class="btn" onclick="testSaveData()">Test saveData</button>
  </div>
  
  <h2>Response:</h2>
  <pre id="response">Click a button to test...</pre>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzfv0GOLR_wPwQZ6Q_13Na_CfC9IT9Onc0UH4LfMPueuQG1vZhEmhHEbbLPUP-WpAKzuQ/exec";
    document.getElementById('apiUrl').textContent = API_URL;
    
    const responseEl = document.getElementById('response');
    
    async function callAPI(action, payload = null) {
      responseEl.textContent = 'Loading...';
      responseEl.className = '';
      
      try {
        let res;
        if (payload) {
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, ...payload })
          });
        } else {
          res = await fetch(`${API_URL}?action=${action}`);
        }
        
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (e) {
          responseEl.textContent = `❌ Not JSON response (${res.status}):\n${text.slice(0, 500)}`;
          responseEl.className = 'error';
          return;
        }
        
        responseEl.textContent = JSON.stringify(json, null, 2);
        responseEl.className = res.ok ? 'success' : 'error';
      } catch (err) {
        responseEl.textContent = `❌ Network error: ${err.message}`;
        responseEl.className = 'error';
      }
    }
    
    function testGetUsers() { callAPI('getUsers'); }
    function testGetData() { callAPI('getData'); }
    function testSaveUser() { 
      callAPI('saveUser', { user: {
        id: 'test_' + Date.now(),
        email: 'test_' + Date.now() + '@example.com',
        password: 'sha1$test$hash',
        name: 'Test User',
        createdAt: new Date().toISOString()
      }}); 
    }
    function testSaveData() {
      callAPI('saveData', { payload: {
        meta: { schoolName: 'Test', programName: 'Test', year: '2026', levels: [] },
        students: []
      }});
    }
  </script>
</body>
</html>
