<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kemajuan Anak — Program Bijak Membaca</title>
  <meta name="theme-color" content="#f6f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var d=localStorage.getItem('sbm_dark_mode');if(d==='true'||(d===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
  <style>
    main.page { padding-bottom: calc(40px + env(safe-area-inset-bottom)) !important; }
    .p-hero .profile-head h3 { color: #fff; font-size: 26px; }
    .p-hero .profile-head p { color: rgba(255,255,255,.8); }
    .p-hero .av { box-shadow: 0 0 0 4px rgba(255,255,255,.35); }
    .p-hero .lvpill { background: rgba(255,255,255,.2); color: #fff; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark" data-icon="book"></span>
        <span class="brand-text">
          <b id="schoolName">SMK Puncak Alam 3</b>
          <small id="programName">Program Bijak Membaca</small>
        </span>
      </div>
      <div class="appbar-actions">
        <button class="icon-btn" data-dark-toggle aria-label="Tukar mod gelap/terang"></button>
      </div>
    </div>
  </header>

  <main class="page wrap">
    <div id="loading" class="card empty"><div class="big">📖</div>Memuatkan laporan…</div>
    <div id="mainContent" style="display:none"></div>
    <div class="card empty" id="emptyState" style="display:none">
      <div class="big">🔍</div>
      <p>Tiada data murid ditemui.</p>
      <p style="font-size:13px;margin-top:8px;font-weight:500">Sila dapatkan pautan khas daripada guru kelas.</p>
    </div>
    <footer class="site" style="margin-top:26px">© <span id="footYear"></span> <span id="footSchool">SMK Puncak Alam 3</span> · Program Bijak Membaca</footer>
  </main>

  <script type="module" src="js/darkmode.js"></script>
  <script type="module">
    import { loadAllData, attendanceStats, levelIndex, quizAvg, checkLevelUp, fmtDate, esc } from './js/data.js';
    import { avatar, levelPill, levelHue, meterClass, hydrateIcons } from './js/ui.js';

    function renderStudent(s, data) {
      const att = attendanceStats(s);
      const lv = levelIndex(data, s);
      const total = data.meta.levels.length;
      const lastAtt = (s.attendance || []).slice().sort((a, b) => (a.d < b.d ? 1 : -1)).slice(0, 20);
      const quizes = (s.quizzes || []).slice().sort((a, b) => (a.d < b.d ? 1 : -1)).slice(0, 10);
      const levelUp = checkLevelUp(data, s);
      const vocab = s.vocabulary || [];
      const pct = total ? Math.round(((lv + 1) / total) * 100) : 0;

      document.getElementById("mainContent").innerHTML = `
        <section class="hero p-hero">
          <div class="eyebrow">Laporan kemajuan · ${esc(data.meta.year)}</div>
          <div class="profile-head" style="margin-top:12px">
            ${avatar(s, "xl")}
            <div style="min-width:0">
              <h3>${esc(s.name)}</h3>
              <p>${esc(s.class)}</p>
              <div style="margin-top:8px">${levelPill(data, lv, true)}</div>
            </div>
          </div>
          <div class="meter" style="margin-top:18px;background:rgba(255,255,255,.2)"><i style="width:${pct}%;background:#fff"></i></div>
          <p style="font-size:12.5px;font-weight:700;margin-top:6px">Tahap ${lv + 1} daripada ${total}</p>
        </section>

        ${levelUp ? `<div class="banner"><span class="emo">🎉</span><div><b>Hebat! Sedia naik ke Tahap ${levelUp.nextLevel}: ${esc(levelUp.nextLevelName)}</b><small>${esc(levelUp.reason)}</small></div></div>` : ""}

        <div class="kpis" style="margin-top:14px">
          <div class="kpi" style="background:var(--surface);border:1px solid var(--line)"><b>${lv + 1}<span style="font-size:14px;color:var(--muted)">/${total}</span></b><small>Tahap</small></div>
          <div class="kpi" style="background:var(--surface);border:1px solid var(--line)"><b style="color:var(--good)">${att.pct}%</b><small>Kehadiran</small></div>
          <div class="kpi" style="background:var(--surface);border:1px solid var(--line)"><b style="color:var(--primary-ink)">${quizAvg(s)}</b><small>Purata kuiz</small></div>
        </div>

        <div class="card">
          <div class="card-title"><span class="ic">📖</span>Perjalanan tahap bacaan</div>
          <div class="journey">
            ${data.meta.levels.map((l, i) => `
              <div class="jstep ${i < lv ? "done" : i === lv ? "cur" : "todo"}" style="--h:${levelHue(i, total)}">
                <div class="dot">${i < lv ? "✓" : i + 1}</div>
                <div class="txt"><b>${esc(l.name)}</b>${i === lv ? "<small>Tahap semasa</small>" : ""}${i === lv && l.material ? ` <a href="${esc(l.material)}" target="_blank" rel="noopener">📎 Bahan latihan di rumah</a>` : ""}</div>
              </div>`).join("")}
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="ic">🗓️</span>Kehadiran · ${att.hadir}/${att.total} sesi</div>
          ${lastAtt.length ? `<div class="att-dots">${lastAtt.map(a => `<span class="${a.s === "h" ? "h" : "a"}" title="${esc(fmtDate(a.d))}">${esc(a.d.split("-")[2] || "")}</span>`).join("")}</div>
            <p class="muted" style="font-size:12px;margin-top:8px;font-weight:600">Hijau = hadir · Merah = tiada · terkini dahulu</p>`
            : '<p class="muted">Tiada rekod sesi.</p>'}
        </div>

        <div class="card">
          <div class="card-title"><span class="ic">📝</span>Keputusan kuiz</div>
          ${quizes.length ? quizes.map(q => `
            <div class="qrow">
              <span class="qt">${esc(q.t)}<small>${esc(fmtDate(q.d))}</small></span>
              <div class="meter ${meterClass(q.s + 5)}"><i style="width:${Math.min(q.s, 100)}%"></i></div>
              <span class="qs">${q.s}</span>
            </div>`).join("") : '<p class="muted">Tiada rekod kuiz.</p>'}
        </div>

        <div class="card">
          <div class="card-title"><span class="ic">🔤</span>Kosa kata dikuasai · ${vocab.length}</div>
          <div class="tags">${vocab.length ? vocab.map(w => `<span class="tag">${esc(w)}</span>`).join("") : '<span class="muted">Tiada perkataan dicatat.</span>'}</div>
        </div>

        <div class="stack no-print" style="margin-top:16px">
          <button class="btn good" id="whatsappBtn">💬 Kongsi melalui WhatsApp</button>
          <button class="btn ghost" id="printBtn"><span data-icon="print"></span> Cetak / Simpan PDF</button>
        </div>`;

      hydrateIcons();
      document.getElementById("printBtn").addEventListener("click", () => window.print());
      document.getElementById("whatsappBtn").addEventListener("click", () => {
        const text =
          `📚 *Laporan Kemajuan ${s.name}*\n` +
          `Kelas: ${s.class}\n` +
          `Tahap: ${data.meta.levels[lv].name}\n` +
          `Kehadiran: ${att.pct}%\n` +
          `Purata Kuiz: ${quizAvg(s)}/100\n\n` +
          `Lihat penuh: ${location.href}\n` +
          `_${data.meta.programName} - ${data.meta.schoolName}_`;
        window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
      });
    }

    async function init() {
      document.getElementById("footYear").textContent = new Date().getFullYear();
      const studentId = new URLSearchParams(location.search).get("student");
      const showEmpty = () => {
        document.getElementById("loading").remove();
        document.getElementById("emptyState").style.display = "block";
      };
      if (!studentId) return showEmpty();

      const data = await loadAllData();
      document.getElementById("schoolName").textContent = data.meta.schoolName;
      document.getElementById("programName").textContent = data.meta.programName;
      document.getElementById("footSchool").textContent = data.meta.schoolName;

      const student = data.students.find(s => s.id === studentId);
      if (!student) return showEmpty();
      document.getElementById("loading").remove();
      document.getElementById("mainContent").style.display = "block";
      document.title = student.name + " — Kemajuan Bacaan";
      renderStudent(student, data);
    }

    init();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
